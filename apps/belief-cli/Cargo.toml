[package]
name = "belief-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "belief"
path = "src/main.rs"

[dependencies]
belief-core = { path = "../../crates/belief-core" }
belief-policy = { path = "../../crates/belief-policy" }
belief-store = { path = "../../crates/belief-store" }
evidence-interchange = { path = "../../crates/evidence-interchange" }
inference-core = { path = "../../crates/inference-core" }
inference-baseline = { path = "../../crates/inference-baseline" }
semantic-decision = { path = "../../crates/semantic-decision" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semif-provider = { path = "../../crates/semif-provider" }
axum = "=0.8.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal"] }
getrandom = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
