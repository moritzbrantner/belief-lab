[workspace]
members = [
    "apps/belief-cli",
    "crates/belief-core",
    "crates/belief-policy",
    "crates/inference-core",
    "crates/inference-baseline",
    "crates/belief-store",
    "crates/evidence-interchange",
    "crates/semantic-decision",
    "crates/semif-provider",
]
default-members = ["apps/belief-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

# Model integrity checks stream multi-GB artifacts even in the default `cargo run` path.
[profile.dev.package.sha2]
opt-level = 3
