[workspace]
members = [
  "apps/belief-cli",
  "crates/belief-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/belief-lab"

[workspace.dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.51", features = ["derive"] }
corpus-core = { package = "moenarch-corpus-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "26d650556328f7b23851e9cf239e006f718bd1c8" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.17"
