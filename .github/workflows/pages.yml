name: Workbench
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Cache the matching generator binary instead of compiling it on every run.
      - name: Restore wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-0.2.128
      - if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: scripts/build-pages.sh
      - run: npm --prefix site ci
      - run: cd site && npx playwright install --with-deps chromium
      - run: npm --prefix site test
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: person-belief-browser-screenshot
          path: |
            target/person-belief-comparison.png
            target/attribution-history.png
            target/attribution-correction.png
          if-no-files-found: error
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
