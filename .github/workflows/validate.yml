name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@728fffa13c451766d08f06e6c7d7950a4de57b3d
    permissions:
      contents: read
      packages: read
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      format_command: cargo fmt --all -- --check
      lint_command: cargo clippy --workspace --all-targets -- -D warnings
      test_command: cargo test --workspace && cargo run --quiet
      cache_bun: false
      cache_cargo: true
      artifact_paths: ""

  pages-validation:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["rust", "pages-validation"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "pages-validation"]'
          allow-skipped: ${{ github.event_name != 'pull_request' && '["pages-validation"]' || '[]' }}
