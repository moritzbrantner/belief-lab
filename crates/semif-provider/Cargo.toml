[package]
name = "semif-provider"
version.workspace = true
edition.workspace = true

[dependencies]
semantic-decision = { path = "../semantic-decision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "belief-semif"
path = "src/bin/belief-semif.rs"

[dev-dependencies]
belief-core = { path = "../belief-core" }
belief-policy = { path = "../belief-policy" }
